services:

  postgres:
    image: postgres:16
    container_name: studywithus-postgres
    environment:
      POSTGRES_DB: studywithus
      POSTGRES_USER: studywithus
      POSTGRES_PASSWORD: studywithus123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - studywithus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studywithus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studywithus-redis
    ports:
      - "6379:6379"
    networks:
      - studywithus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studywithus-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/studywithus
      SPRING_DATASOURCE_USERNAME: studywithus
      SPRING_DATASOURCE_PASSWORD: studywithus123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - studywithus-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studywithus-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - studywithus-network

  nginx:
    image: nginx:alpine
    container_name: studywithus-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - studywithus-network

volumes:
  postgres_data:

networks:
  studywithus-network:
    driver: bridge