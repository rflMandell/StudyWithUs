spring:
  application:
    name: studywithus-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studywithus}
    username: ${DB_USER:studywithus}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000 # 15m in ms
    admin-access-token-expiration: 300000 # 5m in ms for admin roles
    refresh-token-expiration: 604800000 # 7d in ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n"
  level:
    com.studywithus: INFO
    org.springframework.web: INFO

app:
  feed:
    redis-enabled: ${FEED_REDIS_ENABLED:true}
    max-timeline-size: ${FEED_MAX_TIMELINE_SIZE:1000}
    timeline-ttl-days: ${FEED_TIMELINE_TTL_DAYS:7}
  league:
    redis-enabled: ${LEAGUE_REDIS_ENABLED:true}
    season-close-cron: ${LEAGUE_SEASON_CLOSE_CRON:0 0 0 * * MON}
  media:
    storage-type: ${MEDIA_STORAGE_TYPE:s3}
    local-dir: ${MEDIA_LOCAL_DIR:${java.io.tmpdir}/studywithus-media}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080/api/v1/media/public}
    upload-base-url: ${MEDIA_UPLOAD_BASE_URL:http://localhost:8080/api/v1/media/storage}
    presign-secret: ${MEDIA_PRESIGN_SECRET}
    presign-expiration-seconds: 300
    max-file-size-bytes: 5242880
    s3:
      endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9000}
      public-endpoint: ${MEDIA_S3_PUBLIC_ENDPOINT:http://localhost:9000}
      region: ${MEDIA_S3_REGION:us-east-1}
      bucket: ${MEDIA_S3_BUCKET:studywithus-media}
      access-key: ${MEDIA_S3_ACCESS_KEY}
      secret-key: ${MEDIA_S3_SECRET_KEY}
      public-read-policy: ${MEDIA_S3_PUBLIC_READ_POLICY:true}
