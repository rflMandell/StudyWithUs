spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:studywithus_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  data:
    redis:
      repositories:
        enabled: false

security:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration: 3600000 # 1 hour for test
    refresh-token-expiration: 86400000 # 1 day for test

management:
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
