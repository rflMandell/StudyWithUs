spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:studywithus_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  data:
    redis:
      repositories:
        enabled: false

management:
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
