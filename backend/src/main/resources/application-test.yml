spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:studywithus_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  data:
    redis:
      repositories:
        enabled: false

security:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration: 3600000 # 1 hour for test
    admin-access-token-expiration: 300000 # 5m for admin roles
    refresh-token-expiration: 86400000 # 1 day for test

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  health:
    redis:
      enabled: false

app:
  feed:
    redis-enabled: false
  league:
    redis-enabled: false
  rate-limiting:
    enabled: false
  media:
    storage-type: local
    local-dir: ${java.io.tmpdir}/studywithus-media-test
    public-base-url: http://localhost:8080/api/v1/media/public
    upload-base-url: http://localhost:8080/api/v1/media/storage
    presign-secret: test-media-presign-secret-key
    presign-expiration-seconds: 300
    max-file-size-bytes: 5242880
    s3:
      access-key: test_minio
      secret-key: test_minio_pass

subscription:
  webhook:
    secret: test-webhook-secret-2026
