# Aplicação
spring.application.name=studywithus

# Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/studywithus
spring.datasource.username=studywithus
spring.datasource.password=studywithus123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logs
logging.level.com.studywithus=DEBUG